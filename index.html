<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA - Demo Interactive</title>

    <!-- Intercept WebSocket avant le chargement SF pour capter les réponses agent -->
    <script>
    (function() {
        var _WS = WebSocket;
        window.WebSocket = function(u, p) {
            var ws = p ? new _WS(u, p) : new _WS(u);
            ws.addEventListener('message', function(e) {
                try {
                    if (typeof e.data === 'string') {
                        window.dispatchEvent(new CustomEvent('sf-ws', { detail: JSON.parse(e.data) }));
                    }
                } catch(x) {}
            });
            return ws;
        };
        window.WebSocket.prototype = _WS.prototype;
        window.WebSocket.CONNECTING = _WS.CONNECTING;
        window.WebSocket.OPEN = _WS.OPEN;
        window.WebSocket.CLOSING = _WS.CLOSING;
        window.WebSocket.CLOSED = _WS.CLOSED;
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --cyan: #00d4ff; --purple: #8b5cf6;
            --dark: #0a0e1a; --darker: #060810;
            --glass: rgba(255,255,255,.06);
            --border: rgba(255,255,255,.1);
            --dim: #8890a8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(160deg, var(--darker), var(--dark), #0d1425);
            color: #fff; overflow: hidden; height: 100vh;
        }

        /* ── Masquer le widget SF visuellement mais garder le DOM fonctionnel ── */
        .embeddedMessagingConversationButtonWrapper,
        .embeddedMessagingFrame,
        .embedded-messaging,
        [class*="embeddedMessaging"],
        [id*="embeddedMessaging"],
        iframe[name*="ESW"],
        div[data-embedded-messaging] {
            position: fixed !important;
            left: -3000px !important;
            top: 0 !important;
        }

        /* ── Loader ── */
        #loader {
            position: fixed; inset: 0; background: var(--darker);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity .6s;
        }
        #loader.hide { opacity: 0; pointer-events: none; }
        .spin {
            width: 48px; height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: sp 1s linear infinite;
        }
        @keyframes sp { to { transform: rotate(360deg); } }
        #loader p { margin-top: 14px; color: var(--dim); font-size: 13px; }

        /* ── Header ── */
        #hdr {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            background: rgba(6,8,16,.75); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        .st { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
        .dt {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ef4444; transition: all .3s;
        }
        .dt.on { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,.5); }
        .brand {
            font-size: 17px; font-weight: 700;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ── Viewport 3D ── */
        #vp { position: fixed; inset: 0; z-index: 1; }
        #vp canvas { display: block; }

        /* ── Halo ── */
        #halo {
            position: fixed; top: 35%; left: 50%;
            transform: translate(-50%,-50%);
            width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,.1), transparent 70%);
            pointer-events: none; z-index: 2; transition: all .5s;
        }
        #halo.speak {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,212,255,.25), rgba(139,92,246,.08) 50%, transparent 70%);
            animation: hp 1.4s ease-in-out infinite;
        }
        #halo.listen {
            background: radial-gradient(circle, rgba(139,92,246,.18), transparent 70%);
            animation: hp 2s ease-in-out infinite;
        }
        @keyframes hp {
            0%,100% { transform: translate(-50%,-50%) scale(1); }
            50%     { transform: translate(-50%,-50%) scale(1.08); }
        }

        /* ── Chat ── */
        #chat {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 700px; max-height: 44vh;
            overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 10; scrollbar-width: none;
        }
        #chat::-webkit-scrollbar { display: none; }
        .msg {
            padding: 10px 16px; border-radius: 14px;
            font-size: 14px; line-height: 1.55; max-width: 82%;
            animation: mi .3s ease; word-wrap: break-word;
        }
        .msg.a {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); align-self: flex-start;
        }
        .msg.u {
            background: linear-gradient(135deg, rgba(0,212,255,.12), rgba(139,92,246,.12));
            border: 1px solid rgba(0,212,255,.15); align-self: flex-end;
        }
        .msg .lb {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1.2px; font-weight: 700; margin-bottom: 2px;
        }
        .msg.a .lb { color: var(--cyan); }
        .msg.u .lb { color: var(--purple); }
        @keyframes mi {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .dots { display: flex; gap: 5px; padding: 4px 0; }
        .dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--cyan); opacity: .6;
            animation: db 1.4s infinite ease-in-out;
        }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes db {
            0%,80%,100% { transform: scale(.6); }
            40%          { transform: scale(1); }
        }

        /* ── Input ── */
        #bar {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 700px;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 6px 6px 20px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 50px; z-index: 10;
        }
        #bar input {
            flex: 1; border: none; background: none;
            color: #fff; font-size: 14px; padding: 10px 0;
            outline: none; font-family: inherit;
        }
        #bar input::placeholder { color: var(--dim); }
        .cb {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all .25s; flex-shrink: 0;
        }
        #mic {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
        }
        #mic:hover { transform: scale(1.08); box-shadow: 0 0 20px rgba(0,212,255,.3); }
        #mic.on {
            background: linear-gradient(135deg, #ef4444, var(--purple));
            animation: mp 1.5s infinite;
        }
        @keyframes mp {
            0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
            50%      { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
        }
        #snd { background: rgba(255,255,255,.08); color: var(--cyan); }
        #snd:hover { background: rgba(0,212,255,.15); }

        #lis {
            position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: var(--cyan); z-index: 10;
            opacity: 0; transition: opacity .3s;
            display: flex; align-items: center; gap: 6px;
        }
        #lis.on { opacity: 1; }
        .wv { display: flex; gap: 2px; align-items: center; }
        .wv span {
            width: 3px; border-radius: 2px; background: var(--cyan);
            animation: wva .8s ease-in-out infinite;
        }
        .wv span:nth-child(1) { height: 8px; }
        .wv span:nth-child(2) { height: 14px; animation-delay: .15s; }
        .wv span:nth-child(3) { height: 10px; animation-delay: .3s; }
        .wv span:nth-child(4) { height: 16px; animation-delay: .45s; }
        .wv span:nth-child(5) { height: 8px; animation-delay: .6s; }
        @keyframes wva {
            0%,100% { height: 4px; }
            50%      { height: 18px; }
        }

        /* ── SF status ── */
        #sf-status {
            position: fixed; top: 54px; right: 12px;
            font-size: 10px; color: var(--dim);
            background: rgba(0,0,0,.5); padding: 4px 10px;
            border-radius: 8px; z-index: 100;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div id="loader"><div class="spin"></div><p>Chargement de l'avatar...</p></div>

<header id="hdr">
    <div class="st">
        <span class="dt" id="dot"></span>
        <span id="stxt">Connexion...</span>
    </div>
    <span class="brand">Assistant IA</span>
    <div style="width:100px"></div>
</header>

<div id="vp"></div>
<div id="halo"></div>
<div id="chat"></div>

<div id="lis">
    <div class="wv"><span></span><span></span><span></span><span></span><span></span></div>
    &Eacute;coute en cours...
</div>

<div id="bar">
    <input type="text" id="inp" placeholder="Tapez votre message ou appuyez sur le micro..." autocomplete="off">
    <button class="cb" id="mic" title="Parler">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
    </button>
    <button class="cb" id="snd" title="Envoyer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
    </button>
</div>

<div id="sf-status">SF: en attente...</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

/* ══════════════════ THREE.JS ══════════════════ */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
$('vp').appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.05;
ctrl.enableZoom = false;
ctrl.enablePan = false;
ctrl.target.set(0, 1, 0);
ctrl.minPolarAngle = Math.PI / 4;
ctrl.maxPolarAngle = Math.PI / 1.7;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const kl = new THREE.DirectionalLight(0xffffff, 1.5);
kl.position.set(3, 5, 4); scene.add(kl);
const fl2 = new THREE.DirectionalLight(0x00d4ff, 0.4);
fl2.position.set(-4, 2, -3); scene.add(fl2);
const rl2 = new THREE.DirectionalLight(0x8b5cf6, 0.5);
rl2.position.set(0, 4, -5); scene.add(rl2);

const PN = 200;
const pG = new THREE.BufferGeometry();
const pP = new Float32Array(PN * 3);
for (let i = 0; i < PN * 3; i++) pP[i] = (Math.random() - .5) * 16;
pG.setAttribute('position', new THREE.BufferAttribute(pP, 3));
const pM = new THREE.PointsMaterial({ color: 0x00d4ff, size: 0.02, transparent: true, opacity: 0.25 });
const pts = new THREE.Points(pG, pM);
scene.add(pts);

/* ── Load GLB ── */
let model = null, mixer = null;
const gl = new GLTFLoader();
const dr = new DRACOLoader();
dr.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
gl.setDRACOLoader(dr);

gl.load('tour_ia.glb', g => {
    model = g.scene;

    const box = new THREE.Box3().setFromObject(model);
    const sz  = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(sz.x, sz.y, sz.z, 0.01);

    const targetSize = 4;
    const s = targetSize / maxDim;
    model.scale.setScalar(s);

    box.setFromObject(model);
    const nc = box.getCenter(new THREE.Vector3());
    model.position.set(-nc.x, -nc.y, -nc.z);
    box.setFromObject(model);
    model.position.y -= box.min.y;

    scene.add(model);

    if (g.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        g.animations.forEach(c => mixer.clipAction(c).play());
    }

    const finalBox = new THREE.Box3().setFromObject(model);
    const fc = finalBox.getCenter(new THREE.Vector3());
    const fh = finalBox.getSize(new THREE.Vector3()).y;
    camera.position.set(0, fc.y, fh * 1.4);
    ctrl.target.set(0, fc.y, 0);

    console.log('Model loaded - size:', sz, 'scale:', s, 'finalHeight:', fh);

    $('loader').classList.add('hide');
    addMsg('Bonjour ! Je suis votre assistant. Posez-moi une question ou appuyez sur le micro pour parler.', 'a');
    $('dot').classList.add('on');
    $('stxt').textContent = 'Connecté';

}, xhr => {
    if (xhr.total) $('loader').querySelector('p').textContent =
        'Chargement... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
}, err => {
    console.error('GLB error:', err);
    $('loader').querySelector('p').textContent = 'Erreur chargement modèle';
});

/* ── Animate ── */
const clock = new THREE.Clock();
let t = 0, speaking = false, listening = false;

(function loop() {
    requestAnimationFrame(loop);
    const dt = clock.getDelta(); t += dt;
    if (mixer) mixer.update(dt);
    if (model) {
        if (speaking) {
            model.position.y += Math.sin(t * 5) * 0.003;
            model.rotation.y = Math.sin(t * 2) * 0.04;
        } else if (listening) {
            model.rotation.x = -0.04 + Math.sin(t * 2) * 0.015;
        } else {
            model.position.y += Math.sin(t * 1.2) * 0.001;
            model.rotation.y = Math.sin(t * 0.4) * 0.05;
        }
    }
    pts.rotation.y += 0.0003;
    ctrl.update();
    renderer.render(scene, camera);
})();

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

/* ══════════════════ CHAT UI ══════════════════ */
const chatEl = $('chat');
const shown = new Set();

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(text, who) {
    shown.add(text);
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.innerHTML = '<div class="lb">' + (who === 'a' ? 'Agent IA' : 'Vous') + '</div><div>' + esc(text) + '</div>';
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (who === 'a') ttsSpeak(text);
}

function showDots() {
    if ($('typ')) return;
    const d = document.createElement('div');
    d.className = 'msg a'; d.id = 'typ';
    d.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
}
function hideDots() { $('typ')?.remove(); }

/* ══════════════════ VOICE ══════════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

if (SR) {
    rec = new SR();
    rec.lang = 'fr-FR';
    rec.continuous = false;
    rec.interimResults = true;
    rec.onstart = () => {
        listening = true;
        $('mic').classList.add('on');
        $('lis').classList.add('on');
        $('halo').classList.add('listen');
    };
    rec.onresult = e => {
        let txt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        $('inp').value = txt;
        if (e.results[e.results.length - 1].isFinal) sendMsg(txt);
    };
    rec.onend = () => {
        listening = false;
        $('mic').classList.remove('on');
        $('lis').classList.remove('on');
        $('halo').classList.remove('listen');
    };
    rec.onerror = () => {
        listening = false;
        $('mic').classList.remove('on');
        $('lis').classList.remove('on');
        $('halo').classList.remove('listen');
    };
}

const synth = window.speechSynthesis;
let frV = null;

function pickV() {
    const v = synth.getVoices();
    frV = v.find(x => x.lang.startsWith('fr') && /google|microsoft/i.test(x.name))
       || v.find(x => x.lang.startsWith('fr'))
       || v[0] || null;
}
synth.onvoiceschanged = pickV;
pickV();

function ttsSpeak(text) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = 1; u.pitch = 1;
    if (frV) u.voice = frV;
    u.onstart = () => { speaking = true;  $('halo').classList.add('speak'); };
    u.onend   = () => { speaking = false; $('halo').classList.remove('speak'); };
    u.onerror = () => { speaking = false; $('halo').classList.remove('speak'); };
    synth.speak(u);
}

/* ══════════════════ SEND ══════════════════ */
const sent = new Set();

function sendMsg(text) {
    text = (text || '').trim();
    if (!text) return;
    $('inp').value = '';
    sent.add(text);
    addMsg(text, 'u');
    showDots();
    injectIntoSF(text);
}

$('mic').onclick = () => {
    if (!rec) { addMsg('La reconnaissance vocale nécessite Google Chrome.', 'a'); return; }
    listening ? rec.stop() : rec.start();
};
$('snd').onclick = () => sendMsg($('inp').value);
$('inp').onkeydown = e => { if (e.key === 'Enter') sendMsg($('inp').value); };

/* ══════════════════ SALESFORCE BRIDGE ══════════════════ */

/* ── Inject message into SF widget (hidden) with retries ── */
function injectIntoSF(text, attempt) {
    attempt = attempt || 0;
    if (attempt > 15) { sfLog('Input SF introuvable après 15 essais'); return; }

    try {
        const sfInp = deepQ(document.body,
            'textarea, input[type="text"], [contenteditable="true"]',
            el => isSFElement(el));

        if (sfInp) {
            setNativeValue(sfInp, text);
            sfInp.dispatchEvent(new Event('input', { bubbles: true }));
            sfInp.dispatchEvent(new Event('change', { bubbles: true }));
            sfInp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));

            setTimeout(() => {
                const btn = deepQ(document.body,
                    'button[class*="send"], button[class*="Send"], button[aria-label*="Send"], button[aria-label*="Envoyer"], button[title*="Send"]',
                    el => isSFElement(el));
                if (btn) {
                    btn.removeAttribute('disabled');
                    btn.click();
                    sfLog('Message envoyé');
                } else {
                    sfLog('Bouton send non trouvé, retry...');
                    setTimeout(() => injectIntoSF(text, attempt + 1), 500);
                }
            }, 300);
            return;
        }
        sfLog('Input SF non trouvé, essai ' + (attempt + 1) + '...');
        setTimeout(() => injectIntoSF(text, attempt + 1), 800);
    } catch(e) {
        sfLog('Erreur bridge: ' + e.message);
        setTimeout(() => injectIntoSF(text, attempt + 1), 800);
    }
}

function setNativeValue(el, val) {
    const proto = el instanceof HTMLTextAreaElement ? HTMLTextAreaElement : HTMLInputElement;
    const setter = Object.getOwnPropertyDescriptor(proto.prototype, 'value')?.set;
    if (setter) setter.call(el, val);
    else el.value = val;
}

function isSFElement(el) {
    let p = el;
    while (p) {
        const cn = typeof p.className === 'string' ? p.className : '';
        const id = p.id || '';
        if (/embedded|messaging|esw/i.test(cn + id)) return true;
        if (p.host) return true;
        p = p.parentElement || p.parentNode;
    }
    return false;
}

function deepQ(root, sel, filter) {
    if (!root || !root.querySelectorAll) return null;
    for (const el of root.querySelectorAll(sel)) {
        if (!filter || filter(el)) return el;
    }
    for (const el of root.querySelectorAll('*')) {
        if (el.shadowRoot) {
            const r = deepQ(el.shadowRoot, sel, filter);
            if (r) return r;
        }
    }
    return null;
}

/* ── Detect agent responses: WebSocket intercept ── */
window.addEventListener('sf-ws', e => {
    const txt = extractWSText(e.detail);
    if (txt && !shown.has(txt) && !sent.has(txt) && txt.length > 5) {
        shown.add(txt);
        hideDots();
        addMsg(txt, 'a');
        sfLog('Réponse via WS');
    }
});

function extractWSText(d) {
    if (!d) return null;
    try {
        if (d.payload?.abstractMessage?.staticContent?.text)
            return d.payload.abstractMessage.staticContent.text;
        if (d.payload?.text && d.payload?.sender?.role !== 'EndUser' && d.payload?.sender?.role !== 'Customer')
            return d.payload.text;
        if (d.payload?.entries) {
            for (const e of d.payload.entries) {
                if (e.sender?.role === 'EndUser' || e.sender?.role === 'Customer') continue;
                const c = e.messageContent || e.abstractMessage?.staticContent;
                if (c?.text) return c.text;
                if (e.entryPayload) {
                    try {
                        const ep = JSON.parse(e.entryPayload);
                        if (ep.abstractMessage?.staticContent?.text) return ep.abstractMessage.staticContent.text;
                    } catch {}
                }
            }
        }
        if (d.payload?.conversationEntry?.entryPayload) {
            try {
                const ep = JSON.parse(d.payload.conversationEntry.entryPayload);
                const role = d.payload.conversationEntry?.sender?.role;
                if (role !== 'EndUser' && role !== 'Customer' && ep.abstractMessage?.staticContent?.text)
                    return ep.abstractMessage.staticContent.text;
            } catch {}
        }
    } catch {}
    return null;
}

/* ── Detect agent responses: DOM polling (fallback) ── */
let lastPoll = '';

setInterval(() => {
    const texts = [];
    collectSFTexts(document.body, texts);

    for (const txt of texts) {
        if (txt.length > 8 && !shown.has(txt) && !sent.has(txt) && txt !== lastPoll) {
            if (/rejoint|joined|left|quitté|aujourd'hui|AM|PM/i.test(txt) && txt.length < 60) continue;
            lastPoll = txt;
            shown.add(txt);
            hideDots();
            addMsg(txt, 'a');
            sfLog('Réponse via DOM');
        }
    }
}, 800);

function collectSFTexts(root, results) {
    if (!root || !root.querySelectorAll) return;
    for (const el of root.querySelectorAll('*')) {
        const cn = typeof el.className === 'string' ? el.className : '';
        const role = el.getAttribute?.('role') || '';

        if (/message|bubble|chat-content|chatMessage/i.test(cn + role)) {
            if (el.closest?.('#chat') || el.closest?.('#bar')) continue;
            const t = el.textContent?.trim();
            if (t && t.length > 5) {
                const isUser = /outbound|customer|enduser|end-user|cIsConsumer/i.test(cn);
                if (!isUser) results.push(t);
            }
        }

        if (el.shadowRoot) {
            collectSFTexts(el.shadowRoot, results);
        }
    }
}

/* ── Auto-open SF chat ── */
function autoOpenSF() {
    let tries = 0;
    const iv = setInterval(() => {
        tries++;
        if (tries > 20) { clearInterval(iv); return; }

        try {
            if (typeof embeddedservice_bootstrap !== 'undefined' && embeddedservice_bootstrap.utilAPI) {
                embeddedservice_bootstrap.utilAPI.launchChat();
                sfLog('Chat SF ouvert');
                clearInterval(iv);
                return;
            }
        } catch {}

        const btn = deepQ(document.body,
            'button[class*="embeddedMessaging"], button[class*="Conversation"], [class*="ConversationButton"] button');
        if (btn) {
            btn.click();
            sfLog('Bouton SF cliqué');
            clearInterval(iv);
        }
    }, 2000);
}
setTimeout(autoOpenSF, 3000);

function sfLog(msg) {
    $('sf-status').textContent = 'SF: ' + msg;
    console.log('[SF Bridge]', msg);
}
