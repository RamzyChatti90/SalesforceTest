<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA - Assistant Interactif</title>

    <script>
    (function() {
        var _WS = window.WebSocket;
        window.WebSocket = function(url, protocols) {
            var ws = protocols ? new _WS(url, protocols) : new _WS(url);
            ws.addEventListener('message', function(evt) {
                try {
                    if (typeof evt.data === 'string') {
                        var data = JSON.parse(evt.data);
                        window.dispatchEvent(new CustomEvent('sf-ws-msg', { detail: data }));
                    }
                } catch(e) {}
            });
            return ws;
        };
        window.WebSocket.prototype = _WS.prototype;
        window.WebSocket.CONNECTING = _WS.CONNECTING;
        window.WebSocket.OPEN = _WS.OPEN;
        window.WebSocket.CLOSING = _WS.CLOSING;
        window.WebSocket.CLOSED = _WS.CLOSED;
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan: #00d4ff;
            --purple: #8b5cf6;
            --dark: #0a0e1a;
            --darker: #060810;
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.1);
            --text: #ffffff;
            --dim: #8890a8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, var(--darker), var(--dark), #0d1425);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* ── Loader ── */
        #loader {
            position: fixed; inset: 0;
            background: var(--darker);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity .6s;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader p { margin-top: 14px; color: var(--dim); font-size: 13px; }

        /* ── Header ── */
        #header {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            background: rgba(6,8,16,.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }
        .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ef4444; transition: all .3s;
        }
        .dot.on { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,.5); }
        .brand {
            font-size: 17px; font-weight: 700; letter-spacing: .4px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ── 3D viewport ── */
        #viewport { position: fixed; inset: 0; z-index: 1; }
        #viewport canvas { display: block; }

        /* ── Glow ── */
        #glow {
            position: fixed; top: 38%; left: 50%;
            transform: translate(-50%,-50%);
            width: 320px; height: 320px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,.08), transparent 70%);
            pointer-events: none; z-index: 2; transition: all .5s;
        }
        #glow.speaking {
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(0,212,255,.22), rgba(139,92,246,.08) 50%, transparent 70%);
            animation: gPulse 1.4s ease-in-out infinite;
        }
        #glow.listening {
            background: radial-gradient(circle, rgba(139,92,246,.16), transparent 70%);
            animation: gPulse 2s ease-in-out infinite;
        }
        @keyframes gPulse {
            0%,100% { transform: translate(-50%,-50%) scale(1); }
            50%     { transform: translate(-50%,-50%) scale(1.07); }
        }

        /* ── Chat ── */
        #chat {
            position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 700px; max-height: 46vh;
            overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 10; scrollbar-width: none;
        }
        #chat::-webkit-scrollbar { display: none; }

        .msg {
            padding: 10px 16px; border-radius: 14px;
            font-size: 14px; line-height: 1.55;
            max-width: 82%; animation: msgIn .3s ease;
            word-wrap: break-word;
        }
        .msg.agent {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); align-self: flex-start;
        }
        .msg.user {
            background: linear-gradient(135deg, rgba(0,212,255,.12), rgba(139,92,246,.12));
            border: 1px solid rgba(0,212,255,.15); align-self: flex-end;
        }
        .msg .lbl {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1.2px; font-weight: 700;
            margin-bottom: 2px; color: var(--cyan);
        }
        .msg.user .lbl { color: var(--purple); }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dots { display: flex; gap: 5px; padding: 4px 0; }
        .dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--cyan); opacity: .6;
            animation: dotB 1.4s infinite ease-in-out;
        }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes dotB {
            0%,80%,100% { transform: scale(.6); }
            40%          { transform: scale(1); }
        }

        /* ── Input ── */
        #bar {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 700px;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 6px 6px 20px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 50px;
            z-index: 10;
        }
        #bar input {
            flex: 1; border: none; background: none;
            color: var(--text); font-size: 14px; padding: 10px 0;
            outline: none; font-family: inherit;
        }
        #bar input::placeholder { color: var(--dim); }

        .cb {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all .25s; flex-shrink: 0;
        }
        #mic {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
        }
        #mic:hover { transform: scale(1.08); box-shadow: 0 0 20px rgba(0,212,255,.3); }
        #mic.on {
            background: linear-gradient(135deg, #ef4444, var(--purple));
            animation: mPulse 1.5s infinite;
        }
        @keyframes mPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
            50%      { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
        }
        #send {
            background: rgba(255,255,255,.08); color: var(--cyan);
        }
        #send:hover { background: rgba(0,212,255,.15); }

        /* ── Listening label ── */
        #lisTxt {
            position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: var(--cyan); z-index: 10;
            opacity: 0; transition: opacity .3s;
            display: flex; align-items: center; gap: 6px;
        }
        #lisTxt.on { opacity: 1; }
        .wave { display: flex; gap: 2px; align-items: center; }
        .wave span {
            width: 3px; border-radius: 2px; background: var(--cyan);
            animation: waveAni .8s ease-in-out infinite;
        }
        .wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .wave span:nth-child(2) { height: 14px; animation-delay: .15s; }
        .wave span:nth-child(3) { height: 10px; animation-delay: .3s; }
        .wave span:nth-child(4) { height: 16px; animation-delay: .45s; }
        .wave span:nth-child(5) { height: 8px; animation-delay: .6s; }
        @keyframes waveAni {
            0%,100% { height: 4px; }
            50%      { height: 18px; }
        }

        /* ── SF widget adjustments ── */
        .embedded-messaging,
        [class*="embeddedMessaging"] {
            z-index: 50 !important;
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p>Chargement de l'avatar...</p>
</div>

<header id="header">
    <div class="status">
        <span class="dot" id="dot"></span>
        <span id="stxt">Connexion...</span>
    </div>
    <span class="brand">Assistant IA</span>
    <div style="width:100px"></div>
</header>

<div id="viewport"></div>
<div id="glow"></div>
<div id="chat"></div>

<div id="lisTxt">
    <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    &Eacute;coute en cours...
</div>

<div id="bar">
    <input type="text" id="inp" placeholder="Tapez votre message ou appuyez sur le micro..." autocomplete="off">
    <button class="cb" id="mic" title="Parler">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
    </button>
    <button class="cb" id="send" title="Envoyer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
    </button>
</div>

<!-- ── Three.js ── -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const loaderEl = $('loader');
const chatEl   = $('chat');
const inp      = $('inp');
const micBtn   = $('mic');
const sendBtn  = $('send');
const glowEl   = $('glow');
const dotEl    = $('dot');
const stxtEl   = $('stxt');
const lisEl    = $('lisTxt');
const viewport = $('viewport');

/* ══════ Three.js ══════ */
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
viewport.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.05;
ctrl.enableZoom = false;
ctrl.enablePan = false;
ctrl.target.set(0, 1, 0);
ctrl.minPolarAngle = Math.PI / 4;
ctrl.maxPolarAngle = Math.PI / 1.7;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const kl = new THREE.DirectionalLight(0xffffff, 1.2);
kl.position.set(3, 5, 4); scene.add(kl);
const fl = new THREE.DirectionalLight(0x00d4ff, 0.35);
fl.position.set(-4, 2, -3); scene.add(fl);
const rl = new THREE.DirectionalLight(0x8b5cf6, 0.5);
rl.position.set(0, 4, -5); scene.add(rl);

const PN = 250;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PN * 3);
for (let i = 0; i < PN * 3; i++) pPos[i] = (Math.random() - .5) * 14;
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x00d4ff, size: 0.02, transparent: true, opacity: 0.3 });
const pts  = new THREE.Points(pGeo, pMat);
scene.add(pts);

const rGeo = new THREE.RingGeometry(0.6, 1, 64);
const rMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.07, side: THREE.DoubleSide });
const ring = new THREE.Mesh(rGeo, rMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.01;
scene.add(ring);

/* ── Load model ── */
let model = null, mixer = null;
const gltf = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
gltf.setDRACOLoader(draco);

gltf.load('tour_ia.glb', g => {
    model = g.scene;
    const box = new THREE.Box3().setFromObject(model);
    const sz  = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    const s   = 2.5 / Math.max(sz.x, sz.y, sz.z);
    model.scale.setScalar(s);
    model.position.sub(ctr.multiplyScalar(s));
    scene.add(model);

    if (g.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        g.animations.forEach(c => mixer.clipAction(c).play());
    }

    const b2 = new THREE.Box3().setFromObject(model);
    const c2 = b2.getCenter(new THREE.Vector3());
    ctrl.target.copy(c2);
    camera.position.set(c2.x, c2.y + 0.3, c2.z + 3);

    loaderEl.classList.add('hidden');
    addMsg('Bonjour ! Je suis votre assistant IA. Posez-moi une question ou appuyez sur le micro pour parler.', 'agent');
    setStatus(true);

}, xhr => {
    if (xhr.total) loaderEl.querySelector('p').textContent =
        'Chargement... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
}, err => {
    console.error('GLB error:', err);
    loaderEl.querySelector('p').textContent = 'Erreur de chargement du modèle';
});

/* ── Animate ── */
const clock = new THREE.Clock();
let t = 0, speaking = false, listening = false;

(function loop() {
    requestAnimationFrame(loop);
    const dt = clock.getDelta();
    t += dt;
    if (mixer) mixer.update(dt);

    if (model) {
        if (speaking) {
            model.position.y += Math.sin(t * 5) * 0.002;
            model.rotation.y = Math.sin(t * 2) * 0.03;
        } else if (listening) {
            model.rotation.x = -0.03 + Math.sin(t * 2) * 0.01;
        } else {
            model.position.y += Math.sin(t * 1.2) * 0.0007;
            model.rotation.y = Math.sin(t * 0.4) * 0.04;
        }
    }

    pts.rotation.y += 0.0003;
    ring.material.opacity = speaking
        ? 0.12 + Math.sin(t * 4) * 0.08
        : 0.05 + Math.sin(t * 2) * 0.02;

    ctrl.update();
    renderer.render(scene, camera);
})();

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

/* ══════ Chat ══════ */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.innerHTML = '<div class="lbl">' + (who === 'agent' ? 'Agent IA' : 'Vous') + '</div><div>' + esc(text) + '</div>';
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (who === 'agent') speak(text);
}

function showDots() {
    if ($('typing')) return;
    const d = document.createElement('div');
    d.className = 'msg agent'; d.id = 'typing';
    d.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
}

function hideDots() { $('typing')?.remove(); }

/* ══════ Voice Recognition ══════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

if (SR) {
    rec = new SR();
    rec.lang = 'fr-FR';
    rec.continuous = false;
    rec.interimResults = true;

    rec.onstart = () => {
        listening = true;
        micBtn.classList.add('on');
        lisEl.classList.add('on');
        glowEl.classList.add('listening');
    };
    rec.onresult = e => {
        let txt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        inp.value = txt;
        if (e.results[e.results.length - 1].isFinal) send(txt);
    };
    rec.onend = () => {
        listening = false;
        micBtn.classList.remove('on');
        lisEl.classList.remove('on');
        glowEl.classList.remove('listening');
    };
    rec.onerror = () => {
        listening = false;
        micBtn.classList.remove('on');
        lisEl.classList.remove('on');
        glowEl.classList.remove('listening');
    };
}

/* ══════ TTS ══════ */
const synth = window.speechSynthesis;
let frVoice = null;

function pickVoice() {
    const v = synth.getVoices();
    frVoice = v.find(x => x.lang.startsWith('fr') && /google|microsoft/i.test(x.name))
           || v.find(x => x.lang.startsWith('fr'))
           || v[0] || null;
}
synth.onvoiceschanged = pickVoice;
pickVoice();

function speak(text) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = 'fr-FR';
    u.rate  = 1;
    u.pitch = 1;
    if (frVoice) u.voice = frVoice;

    u.onstart = () => { speaking = true;  glowEl.classList.add('speaking'); };
    u.onend   = () => { speaking = false; glowEl.classList.remove('speaking'); };
    u.onerror = () => { speaking = false; glowEl.classList.remove('speaking'); };

    synth.speak(u);
}

/* ══════ Send message ══════ */
const sent = new Set();

function send(text) {
    text = (text || '').trim();
    if (!text) return;
    inp.value = '';
    sent.add(text);
    addMsg(text, 'user');
    showDots();
    bridgeSF(text);
}

/* ══════ Salesforce bridge ══════ */
function bridgeSF(text) {
    try {
        const sfInp = deepFind(document.body,
            'textarea, input[type="text"], [contenteditable="true"]',
            el => {
                let p = el;
                while (p) {
                    if (p.className && typeof p.className === 'string' &&
                        (/embedded/i.test(p.className) || /messaging/i.test(p.className))) return true;
                    p = p.parentElement;
                }
                return false;
            });

        if (sfInp) {
            const set = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value')?.set
                     || Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
            if (set) {
                set.call(sfInp, text);
                sfInp.dispatchEvent(new Event('input',  { bubbles: true }));
                sfInp.dispatchEvent(new Event('change', { bubbles: true }));
            } else {
                sfInp.value = text;
            }

            setTimeout(() => {
                const btn = deepFind(document.body,
                    'button[class*="send"], button[aria-label*="Send"], button[aria-label*="Envoyer"], button[title*="Send"]');
                if (btn) btn.click();
            }, 250);
            return;
        }
    } catch(e) { console.log('SF bridge err:', e); }
}

function deepFind(root, sel, filter) {
    for (const el of root.querySelectorAll(sel)) {
        if (!filter || filter(el)) return el;
    }
    for (const el of root.querySelectorAll('*')) {
        if (el.shadowRoot) {
            const r = deepFind(el.shadowRoot, sel, filter);
            if (r) return r;
        }
    }
    return null;
}

/* ══════ Detect agent replies via WebSocket ══════ */
const seen = new Set();

window.addEventListener('sf-ws-msg', e => {
    const text = extractText(e.detail);
    if (text && !seen.has(text) && !sent.has(text)) {
        seen.add(text);
        hideDots();
        addMsg(text, 'agent');
    }
});

function extractText(d) {
    if (!d) return null;
    try {
        if (d.payload?.abstractMessage?.staticContent?.text)
            return d.payload.abstractMessage.staticContent.text;
        if (d.payload?.text && d.payload?.sender?.role !== 'EndUser')
            return d.payload.text;
        if (d.payload?.entries) {
            for (const entry of d.payload.entries) {
                if (entry.entryType === 'Message' && entry.sender?.role !== 'EndUser') {
                    const content = entry.messageContent || entry.abstractMessage?.staticContent;
                    if (content?.text) return content.text;
                }
            }
        }
        if (d.type === 'CONVERSATION_MESSAGE' && d.message?.content)
            return d.message.content;
    } catch {}
    return null;
}

/* ── DOM observer fallback ── */
let lastDetected = '';
const obs = new MutationObserver(muts => {
    for (const m of muts) {
        for (const n of m.addedNodes) {
            if (n.nodeType !== 1) continue;
            const cl = n.className || '';
            if (typeof cl === 'string' && (/message/i.test(cl) || /chat/i.test(cl))) {
                const txt = n.textContent?.trim();
                if (txt && txt.length > 3 && txt !== lastDetected && !sent.has(txt)) {
                    const isOut = /outbound|user|customer|enduser/i.test(cl);
                    if (!isOut) {
                        lastDetected = txt;
                        hideDots();
                        if (!seen.has(txt)) {
                            seen.add(txt);
                            addMsg(txt, 'agent');
                        }
                    }
                }
            }
        }
    }
});
obs.observe(document.body, { childList: true, subtree: true });

/* ══════ Events ══════ */
micBtn.onclick = () => {
    if (!rec) { addMsg('La reconnaissance vocale nécessite Google Chrome.', 'agent'); return; }
    listening ? rec.stop() : rec.start();
};
sendBtn.onclick = () => send(inp.value);
inp.onkeydown  = e => { if (e.key === 'Enter') send(inp.value); };

function setStatus(on) {
    dotEl.className = on ? 'dot on' : 'dot';
    stxtEl.textContent = on ? 'Connecté' : 'Déconnecté';
}
</script>

<!-- ── Salesforce Embedded Messaging ── -->
<script>
function initEmbeddedMessaging() {
    try {
        embeddedservice_bootstrap.settings.language = 'fr';
        embeddedservice_bootstrap.init(
            '00DKE000000H0qv',
