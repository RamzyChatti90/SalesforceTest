<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA - Demo Interactive</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --cyan: #00d4ff; --purple: #8b5cf6;
            --dark: #0a0e1a; --darker: #060810;
            --glass: rgba(255,255,255,.06);
            --border: rgba(255,255,255,.1);
            --dim: #8890a8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(160deg, var(--darker), var(--dark), #0d1425);
            color: #fff; overflow: hidden; height: 100vh;
        }

        #loader {
            position: fixed; inset: 0; background: var(--darker);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity .6s;
        }
        #loader.hide { opacity: 0; pointer-events: none; }
        .spin {
            width: 48px; height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--cyan);
            border-radius: 50%; animation: sp 1s linear infinite;
        }
        @keyframes sp { to { transform: rotate(360deg); } }
        #loader p { margin-top: 14px; color: var(--dim); font-size: 13px; }

        #hdr {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            background: rgba(6,8,16,.75); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        .st { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
        .dt { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; transition: all .3s; }
        .dt.on { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,.5); }
        .brand {
            font-size: 17px; font-weight: 700;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        #vp { position: fixed; inset: 0; z-index: 1; }
        #vp canvas { display: block; }

        #halo {
            position: fixed; top: 28%; left: 50%;
            transform: translate(-50%,-50%);
            width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,.1), transparent 70%);
            pointer-events: none; z-index: 2;
        }

        /* ── SF widget : centré en bas, agrandi ── */
        embedded-messaging,
        .embedded-messaging {
            z-index: 50 !important;
        }

        .embeddedMessagingFrame,
        iframe[name*="ESW"],
        iframe[title*="Chat"],
        iframe[class*="embeddedMessaging"] {
            position: fixed !important;
            bottom: 16px !important;
            right: auto !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 94% !important;
            max-width: 480px !important;
            height: 54vh !important;
            max-height: 520px !important;
            border-radius: 18px !important;
            border: 1px solid var(--border) !important;
            box-shadow: 0 8px 40px rgba(0,0,0,.5), 0 0 80px rgba(0,212,255,.04) !important;
            z-index: 50 !important;
        }

        #sf-status {
            position: fixed; top: 54px; right: 12px;
            font-size: 10px; color: var(--dim);
            background: rgba(0,0,0,.5); padding: 4px 10px;
            border-radius: 8px; z-index: 100; opacity: 0.6;
        }
    </style>
</head>
<body>

<div id="loader"><div class="spin"></div><p>Chargement de l'avatar...</p></div>

<header id="hdr">
    <div class="st"><span class="dt" id="dot"></span><span id="stxt">Connexion...</span></div>
    <span class="brand">Assistant IA</span>
    <div style="width:100px"></div>
</header>

<div id="vp"></div>
<div id="halo"></div>
<div id="sf-status">SF: en attente...</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

/* ══════════ THREE.JS ══════════ */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0, 1, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
$('vp').appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.05;
ctrl.enableZoom = false; ctrl.enablePan = false;
ctrl.minPolarAngle = Math.PI / 4; ctrl.maxPolarAngle = Math.PI / 1.7;

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const kl = new THREE.DirectionalLight(0xffffff, 1.5); kl.position.set(3, 5, 4); scene.add(kl);
const fl = new THREE.DirectionalLight(0x00d4ff, 0.4); fl.position.set(-4, 2, -3); scene.add(fl);
const rl = new THREE.DirectionalLight(0x8b5cf6, 0.5); rl.position.set(0, 4, -5); scene.add(rl);

const PN = 200;
const pG = new THREE.BufferGeometry();
const pP = new Float32Array(PN * 3);
for (let i = 0; i < PN * 3; i++) pP[i] = (Math.random() - .5) * 20;
pG.setAttribute('position', new THREE.BufferAttribute(pP, 3));
scene.add(new THREE.Points(pG, new THREE.PointsMaterial({ color: 0x00d4ff, size: 0.03, transparent: true, opacity: 0.2 })));

function meshBox(obj) {
    const b = new THREE.Box3();
    obj.traverse(c => { if (c.isMesh && c.visible) b.expandByObject(c); });
    if (b.isEmpty()) b.setFromObject(obj);
    return b;
}

function fitCamera(object, offset) {
    offset = offset || 1.25;
    const box = meshBox(object);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = camera.fov * (Math.PI / 180);
    let dist = (maxDim / 2) / Math.tan(fov / 2) * offset;
    camera.position.set(center.x, center.y, center.z + dist);
    camera.near = 0.01; camera.far = dist * 20;
    camera.updateProjectionMatrix();
    ctrl.target.copy(center); ctrl.update();
}

/* ── Load GLB ── */
let model = null, mixer = null;
const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
gltfLoader.setDRACOLoader(dracoLoader);

gltfLoader.load('tour_ia.glb', g => {
    model = g.scene;
    model.traverse(child => { if (child.geometry) child.geometry.computeBoundingBox(); });

    let box = meshBox(model);
    const sz = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(sz.x, sz.y, sz.z, 0.001);

    const targetSize = 3;
    model.scale.setScalar(targetSize / maxDim);

    box = meshBox(model);
    const ctr = box.getCenter(new THREE.Vector3());
    model.position.set(-ctr.x, -ctr.y, -ctr.z);

    box = meshBox(model);
    model.position.y -= box.min.y;

    scene.add(model);

    if (g.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        g.animations.forEach(c => mixer.clipAction(c).play());
    }

    fitCamera(model, 1.3);
    $('loader').classList.add('hide');
    $('dot').classList.add('on');
    $('stxt').textContent = 'Connecté';

}, xhr => {
    if (xhr.total) $('loader').querySelector('p').textContent =
        'Chargement... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
}, err => {
    console.error('GLB error:', err);
    $('loader').querySelector('p').textContent = 'Erreur chargement modèle';
});

/* ── Animate ── */
const clock = new THREE.Clock();
let t = 0;
(function loop() {
    requestAnimationFrame(loop);
    const dt = clock.getDelta(); t += dt;
    if (mixer) mixer.update(dt);
    if (model) model.rotation.y = Math.sin(t * 0.4) * 0.05;
    ctrl.update();
    renderer.render(scene, camera);
})();

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (model) fitCamera(model, 1.3);
});

/* ══════════ SF WIDGET RESTYLE ══════════ */
function styleSFWidget() {
    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(f => {
        const src = f.src || '';
        const cls = f.className || '';
        if (src.includes('salesforce') || src.includes('ESW') || cls.includes('embeddedMessaging')) {
            f.style.cssText = `
                position: fixed !important;
                bottom: 16px !important;
                right: auto !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 94% !important;
                max-width: 480px !important;
                height: 54vh !important;
                max-height: 520px !important;
                border-radius: 18px !important;
                border: 1px solid rgba(255,255,255,0.1) !important;
                box-shadow: 0 8px 40px rgba(0,0,0,0.5) !important;
                z-index: 50 !important;
            `;
        }
    });
}

const sfObs = new MutationObserver(() => styleSFWidget());
sfObs.observe(document.body, { childList: true, subtree: true });
setInterval(styleSFWidget, 2000);

/* ── Auto-open SF chat ── */
function autoOpenSF() {
    let tries = 0;
    const iv = setInterval(() => {
        if (++tries > 25) { clearInterval(iv); return; }
        try {
            if (typeof embeddedservice_bootstrap !== 'undefined' && embeddedservice_bootstrap.utilAPI) {
                embeddedservice_bootstrap.utilAPI.launchChat();
                $('sf-status').textContent = 'SF: chat ouvert';
                clearInterval(iv);
                return;
            }
        } catch {}
    }, 2000);
}
setTimeout(autoOpenSF, 3000);
</script>

<!-- Salesforce Embedded Messaging -->

</script>
<script src="https://ellisphere2025--devob.sandbox.my.site.com/ESWGithubMessaging1779289119988/assets/js/bootstrap.min.js" onload="initEmbeddedMessaging()"></script>
</body>
</html>
